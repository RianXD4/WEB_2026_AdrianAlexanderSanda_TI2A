<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-mini</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="list.html">Daftar Buku</a></li>
                    <li><a href="tambah.html">Tambah Buku</a></li>
                    <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                </ul>
            </nav>
    </header>
    <main>
        <section>
            <h2>Tambah Buku</h2>
            <form id="form-tambah">
                <p>
                    <label for="judul">Judul</label><br>
                    <input type="text" id="judul" name="judul">
                </p>
                <p>
                    <label for="pengarang">Pengarang</label><br>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>
                <p>
                    <label for="tahun">Tahun</label><br>
                    <input type="number" id="tahun" name="tahun" required>
                </p>
                <p>
                    <label for="isbn">ISBN</label><br>
                    <input type="text" id="isbn" name="isbn" required>
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="text" id="stok" name="stok" required>
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select name="kategori" id="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SIMPUS-mini &mdash; Jobsheet 1</p>
    </footer>
   <script src="../assets/js/app.js"></script>
</body>
</html>
